<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自己紹介</title>
    <style>
        body {
            margin: 0;
            background: linear-gradient(135deg, #fffafc 0%, #f3f7ff 100%);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        main {
            width: min(90%, 700px);
            background: #fff;
            border: 2px solid #f7d9e6;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(140, 120, 170, 0.12);
            padding: 32px;
        }

        .photo-wrap {
            text-align: center;
            margin-bottom: 20px;
        }

        .photo {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #f5c7d9;
            box-shadow: 0 8px 18px rgba(238, 153, 191, 0.25);
            display: block;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        p {
            color: #555;
            text-align: center;
        }
    </style>
</head>
<body>
    <main>
        <div class="photo-wrap">
<div class="photo-wrap">
    <img class="photo" src="./.s.png" alt="プロフィール写真">
</div>
        </div>

        <h1>自己紹介</h1>
        <p>はじめまして、よろしくお願いします。</p>

        <section>
            <h2>基本情報</h2>
            <p>名前：許　宏博</p>
            <p>年齢：22歳</p>
            <p>住まい：京都</p>
            <p>趣味：読書、旅行、プログラミング</p>
        </section>
    </main>
</body>
</html>
